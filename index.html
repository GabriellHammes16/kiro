<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'" />
    <title>KUROI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><img class="brand-logo" src="kuroi-logo-transparent.png" alt="Logo KUROI" /><span>KUROI</span></div>
        <button class="new-note" id="new-note">＋ Nova nota</button>
        <button class="quiet-button" id="daily-note">▣ Nota diária</button>
        <nav aria-label="Navegação principal">
          <button class="nav-item active" data-view="today"><span>☀</span> Hoje</button>
          <button class="nav-item" data-view="notes"><span>▤</span> Notas</button>
          <button class="nav-item" data-view="tasks"><span>✓</span> Tarefas <b id="task-count"></b></button>
          <button class="nav-item" data-view="studies"><span>▣</span> Pastas</button>
        </nav>
        <div class="sidebar-bottom">
          <button class="quiet-button" id="export-data">⇩ Exportar dados</button>
          <label class="quiet-button import-label">⇧ Importar dados<input type="file" id="import-data" accept="application/json" /></label>
          <button class="quiet-button" id="open-vault">▣ Abrir pasta do cofre</button>
          <button class="quiet-button" id="choose-vault">Escolher outro cofre</button>
          <button class="quiet-button" id="trash">Lixeira</button>
          <button class="quiet-button" id="settings">Configurações</button>
          <button class="quiet-button" id="reload-vault">Recarregar cofre</button>
          <p id="vault-path">Carregando cofre…</p>
        </div>
      </aside>
      <main id="app" class="content" tabindex="-1"></main>
    </div>
    <div id="modal-root"></div>
    <div id="save-status" role="status" aria-live="polite">Carregando…</div>
    <script src="domain.js"></script>
    <script src="app.js"></script>
  </body>
</html>
