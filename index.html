<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; worker-src 'self' blob: kiro-plugin:; frame-src 'self' kiro-plugin:; style-src 'self' 'unsafe-inline'; img-src 'self' data: kiro-anexo:; object-src 'none'; base-uri 'none'" />
    <title>Kiro</title>
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="temas.css" />
  </head>
  <body>
    <div id="abertura" role="presentation"><img src="kiro-abertura.png" alt="" /></div>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-topo"><button class="icon-button lateral-alternar" id="alternar-lateral" data-icone="esquerda" aria-label="Recolher barra lateral" title="Recolher barra lateral (Ctrl+\)" aria-expanded="true"></button></div>
        <button class="new-note" id="new-note"><span class="rotulo-icone" data-icone="mais"></span><span class="rotulo">Nova nota</span></button>
        <button class="quiet-button" id="daily-note"><span class="rotulo-icone" data-icone="calendario"></span><span class="rotulo">Nota diária</span></button>
        <button class="quiet-button" id="go-note" title="Ctrl+O"><span class="rotulo-icone" data-icone="ir-para"></span><span class="rotulo">Ir para nota</span></button>
        <nav aria-label="Navegação principal">
          <button class="nav-item active" data-view="today"><span class="rotulo-icone" data-icone="hoje"></span><span class="rotulo">Hoje</span></button>
          <button class="nav-item" data-view="notes"><span class="rotulo-icone" data-icone="notas"></span><span class="rotulo">Notas</span></button>
          <button class="nav-item" data-view="tasks"><span class="rotulo-icone" data-icone="tarefas"></span><span class="rotulo">Tarefas</span> <b id="task-count"></b></button>
          <button class="nav-item" data-view="studies"><span class="rotulo-icone" data-icone="pastas"></span><span class="rotulo">Pastas</span></button>
          <button class="nav-item" data-view="graph"><span class="rotulo-icone" data-icone="grafo"></span><span class="rotulo">Grafo</span></button>
        </nav>
        <nav id="nav-plugins" class="nav-plugins" aria-label="Plug-ins" hidden></nav>
        <div class="sidebar-bottom">
          <button class="quiet-button" id="settings"><span class="rotulo-icone" data-icone="detalhes"></span><span class="rotulo">Configurações</span></button>
        </div>
      </aside>
      <main id="app" class="content" tabindex="-1"></main>
    </div>
    <div id="modal-root"></div>
    <div id="save-status" role="status" aria-live="polite">Carregando…</div>
    <script src="vendor/katex/katex.min.js"></script>
    <script src="domain.js"></script>
    <script src="plugins.js"></script>
    <script src="abas.js"></script>
    <script src="app.js"></script>
  </body>
</html>
