<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' data:; worker-src 'self' blob: kiro-plugin:; frame-src 'self' kiro-plugin:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: kiro-anexo:; media-src 'self' blob:; object-src 'none'; base-uri 'none'" />
    <title>Kiro</title>
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="temas.css" />
  </head>
  <body>
    <div id="abertura" role="presentation"><img src="kiro-abertura.png" alt="" /></div>
    <div id="barra-titulo"><img src="kiro-logo.png" alt="" /><span>Kiro</span></div>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-topo">
          <button class="busca-rapida" id="go-note" title="Ir para nota (Ctrl+O)"><span class="rotulo-icone" data-icone="ir-para-nota"></span><span class="rotulo">Ir para nota</span><kbd class="rotulo">Ctrl+O</kbd></button>
          <button class="icon-button lateral-alternar" id="alternar-lateral" data-icone="esquerda" aria-label="Recolher barra lateral" title="Recolher barra lateral (Ctrl+\)" aria-expanded="true"></button>
        </div>
        <div class="acoes-rapidas">
          <button class="new-note" id="new-note"><span class="rotulo-icone" data-icone="nova-nota"></span><span class="rotulo">Nova nota</span></button>
          <button class="nota-diaria" id="daily-note" title="Nota diária"><span class="rotulo-icone" data-icone="nota-diaria"></span><span class="rotulo">Diária</span></button>
        </div>
        <nav aria-label="Navegação principal">
          <button class="nav-item active" data-view="today"><span class="rotulo-icone" data-icone="hoje"></span><span class="rotulo">Hoje</span></button>
          <button class="nav-item" data-view="notes"><span class="rotulo-icone" data-icone="notas"></span><span class="rotulo">Notas</span></button>
          <button class="nav-item" data-view="tasks"><span class="rotulo-icone" data-icone="tarefas"></span><span class="rotulo">Tarefas</span> <b id="task-count"></b></button>
          <button class="nav-item" data-view="studies"><span class="rotulo-icone" data-icone="pastas"></span><span class="rotulo">Pastas</span></button>
          <button class="nav-item" data-view="graph"><span class="rotulo-icone" data-icone="grafo"></span><span class="rotulo">Grafo</span></button>
        </nav>
        <nav id="nav-plugins" class="nav-plugins" aria-label="Plug-ins" hidden></nav>
        <div class="sidebar-bottom">
          <button class="cofre-seletor" id="cofre-seletor" aria-label="Trocar de cofre"><span class="rotulo-icone" data-icone="alternar-cofre"></span><span class="rotulo" id="cofre-seletor-nome">Kiro</span></button>
          <button class="quiet-button" id="lixeira-lateral" title="Lixeira" aria-label="Lixeira"><span class="rotulo-icone" data-icone="lixeira"></span><span class="rotulo">Lixeira</span></button>
          <button class="quiet-button" id="settings" title="Configurações" aria-label="Configurações"><span class="rotulo-icone" data-icone="configuracoes"></span><span class="rotulo">Configurações</span></button>
        </div>
      </aside>
      <main id="app" class="content" tabindex="-1"></main>
    </div>
    <div id="modal-root"></div>
    <div id="save-status" role="status" aria-live="polite">Carregando…</div>
    <script src="vendor/katex/katex.min.js"></script>
    <script src="idiomas.js"></script>
    <script src="corretor.js"></script>
    <script src="editor-nota.js"></script>
    <script src="ortografia.js"></script>
    <script src="domain.js"></script>
    <script src="plugins.js"></script>
    <script src="abas.js"></script>
    <script src="fluxo.js"></script>
    <script src="fluxo-tela.js"></script>
    <script src="hoje.js"></script>
    <script src="icones-tema.js"></script>
    <script src="app.js"></script>
  </body>
</html>
